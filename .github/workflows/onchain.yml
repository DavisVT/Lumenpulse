name: Onchain CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/onchain/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/onchain/**'
      - 'apps/onchain/.ci-trigger'

jobs:
  onchain-checks:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/onchain

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "apps/onchain"

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build Contracts
      run: cargo build --target wasm32-unknown-unknown --release

    - name: Report and enforce contract WASM sizes
      id: wasm-size
      env:
        WASM_SIZE_BUDGET_BYTES: 1048576
      run: |
        node ../../scripts/check-wasm-size.mjs | tee wasm-size.md >> "$GITHUB_STEP_SUMMARY"

    - name: Add WASM size report to pull request
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: wasm-size
        path: apps/onchain/wasm-size.md

    - name: Run tests
      if: env.SKIP_TESTS != 'true'
      run: cargo test
